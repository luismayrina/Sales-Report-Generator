name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a version tag like v1.0.0, v1.1.0, etc.
  workflow_dispatch: # Allows you to manually run this workflow from the GitHub website

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sales_report_app/requirements.txt
          pip install pyinstaller

      - name: Build Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd sales_report_app
          python -m PyInstaller --noconfirm --windowed --onefile --name "Sales Report Generator" app.py
          mv "dist/Sales Report Generator.exe" ../Sales-Report-Generator-Windows.exe
        shell: bash

      - name: Build Executable (Mac)
        if: matrix.os == 'macos-latest'
        run: |
          cd sales_report_app
          python3 -m PyInstaller --noconfirm --windowed --onefile --name "Sales Report Generator" app.py
          cd dist
          zip -r ../../Sales-Report-Generator-Mac.zip "Sales Report Generator.app"
        shell: bash

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Sales-Report-Generator-Windows.exe
            Sales-Report-Generator-Mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
